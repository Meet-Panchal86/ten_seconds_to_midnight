[package]
name = "ten_seconds_to_midnight"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.19.1", features = ["mp3", "wav"] }
directories = "6.0.0"
rand = "0.10.3"

# [profile.dev]
# opt-level = 1

# [profile.dev.package."*"]
# opt-level = 3

# Disable verbose debug log calls at compile-time for extra speed
log = { version = "*", features = ["max_level_debug", "release_max_level_warn"] }

[profile.release]
opt-level = 3
lto = "thin"         # Link-Time Optimization (improves performance)
codegen-units = 1    # Maximizes optimization across modules
strip = true         # Removes debug symbols to shrink .exe size